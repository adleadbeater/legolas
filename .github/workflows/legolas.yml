name: Legolas News Scout

on:
  schedule:
    # Every 30 min 5am–7:30pm ET, plus once at 10pm ET, in both seasons.
    # GitHub cron is UTC-only, so season-specific slots are listed separately
    # and the gate job below skips the ones for the other season.
    - cron: '*/30 10-23 * * *'  # 6am–7:30pm EDT / 5am–6:30pm EST (both)
    - cron: '*/30 9 * * *'      # 5am, 5:30am EDT (EDT only)
    - cron: '0,30 0 * * *'      # 7pm, 7:30pm EST (EST only)
    - cron: '0 2 * * *'         # 10pm EDT (EDT only)
    - cron: '0 3 * * *'         # 10pm EST (EST only)
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.season.outputs.run }}
    steps:
      - name: Skip slots meant for the other DST season
        id: season
        env:
          SLOT: ${{ github.event.schedule }}
        run: |
          zone=$(TZ=America/New_York date +%Z)
          case "$zone|$SLOT" in
            "EST|*/30 9 * * *"|"EST|0 2 * * *"|"EDT|0,30 0 * * *"|"EDT|0 3 * * *")
              echo "Slot '$SLOT' is for the other season (now $zone); skipping."
              echo "run=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "run=true" >> "$GITHUB_OUTPUT" ;;
          esac

  run:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google service account key
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > legolas-key.json

      - name: Run Legolas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS: legolas-key.json
        run: python legolas.py

      - name: Commit updated learnings
        run: |
          git config user.name "Legolas Bot"
          git config user.email "legolas-bot@users.noreply.github.com"
          git add data/learnings.json data/seen.db
          git diff --staged --quiet || git commit -m "chore: update learnings + seen store [skip ci]"
          git push

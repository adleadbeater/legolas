name: Legolas News Scout

# Approved 13 Nov 2026: Legolas V2 (python -m legolas2), every 15 minutes, with its
# state (story store, seen-set, cost ledger, story feed) kept in the Actions cache
# instead of being committed back to this public repo. Spend cap: $1/day
# (config/legolas-v2.yaml budget.daily_usd_cap).
#
# Kill switch: set the repository VARIABLE LEGOLAS_KILL to 1
# (Settings -> Secrets and variables -> Actions -> Variables), or disable this
# workflow under the Actions tab.

on:
  schedule:
    # Every 15 min. GitHub cron is UTC-only, so these cover 5am-10pm ET in both
    # seasons and the gate job below skips slots outside that window.
    - cron: '*/15 9-23 * * *'
    - cron: '*/15 0-3 * * *'
  workflow_dispatch: # manual run from the Actions tab (always runs)

# One run at a time, queued, so two runs never write the state cache at once.
concurrency:
  group: legolas
  cancel-in-progress: false

permissions:
  contents: read   # V2 never pushes to the repo

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.window.outputs.run }}
    steps:
      - name: Only run 5:00am-10:00pm ET
        id: window
        env:
          EVENT: ${{ github.event_name }}
        run: |
          hm=$(TZ=America/New_York date +%H%M)
          if [ "$EVENT" = "workflow_dispatch" ] || { [ "$hm" -ge 0500 ] && [ "$hm" -lt 2215 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Outside 5am-10pm ET (now ${hm} ET); skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Legolas state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: legolas-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            legolas-state-

      - name: Write Google service account key (outside the repo)
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          umask 077
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > "$RUNNER_TEMP/legolas-key.json"

      - name: Run Legolas V2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          LEGOLAS_POST_CHANNEL: ${{ secrets.LEGOLAS_POST_CHANNEL }}
          LEGOLAS_FEEDBACK_CHANNEL: ${{ secrets.LEGOLAS_FEEDBACK_CHANNEL }}
          LEGOLAS_TITLE_RULES_B64: ${{ secrets.LEGOLAS_TITLE_RULES_B64 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/legolas-key.json
          LEGOLAS_KILL: ${{ vars.LEGOLAS_KILL }}
          SCOUT_STATE_DIR: state
        run: python -m legolas2 --post

      - name: Remove key file
        if: always()
        run: rm -f "$RUNNER_TEMP/legolas-key.json"

      - name: Save Legolas state
        # always(): the cost ledger must survive failed runs, or the $1 cap resets
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: legolas-state-${{ github.run_id }}-${{ github.run_attempt }}

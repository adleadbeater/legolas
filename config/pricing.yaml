# Claude API list prices, USD per million tokens. Used by the cost ledger.
# Source: Anthropic model/pricing reference as of 2026-11 (claude-api skill, cached
# 2026-11-03). Re-check https://platform.claude.com/docs/en/about-claude/pricing
# before changing budgets. Cache writes: 1.25x input (5-minute TTL), 2x input
# (1-hour TTL). Cache reads: ~0.1x input (0.05x on Sonnet 5.5).
models:
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
    cache_write_5m: 0.125
    cache_write_1h: 0.20
    cache_read: 0.01
    # Prompts over 100K tokens are billed at 0.50 / 2.50. Scout prompts are tiny,
    # so the ledger flags (but does not reprice) any call above the threshold.
    long_context_threshold: 100000
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_write_5m: 2.50
    cache_write_1h: 4.00
    cache_read: 0.10
  # Only used to price "today's design" in the replay comparison.
  claude-sonnet-4-6:
    input: 3.00
    output: 15.00
    cache_write_5m: 3.75
    cache_write_1h: 6.00
    cache_read: 0.30

server_tools:
  web_search_per_use: 0.01   # $10 per 1,000 searches

# Message Batches API: 50% off all token usage (not web search).
batch_discount: 0.5

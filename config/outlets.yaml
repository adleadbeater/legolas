# Outlet normalisation, credibility tiers and independence rules (shared scout library).
# DRAFT FOR EDITOR SIGN-OFF: the tier list below is a starting proposal.
#
# Credibility tiers
#   1 = original reporting (trades, national press, the outlet that broke it)
#   2 = established fan / genre / scoop sites with their own sourcing
#   3 = aggregators, re-runs, wire syndication, finance/SEO sites. Never count
#       towards a trend; can only corroborate.
# Outlets not listed here (and not in feeds.yaml) default to tier 3. Legolas reads
# only the RSS feeds in feeds.yaml (Google News was dropped on 13 Nov 2026).

aliases:
  # spelling variant (lower-case) -> canonical outlet name
  screenrant: Screen Rant
  screen rant: Screen Rant
  the wrap: The Wrap

tiers:
  1: [Deadline, Variety, Hollywood Reporter, The Wrap, TVLine, IndieWire, Vulture,
      Entertainment Weekly, Vanity Fair, Rolling Stone, TIME, NYT Arts, LA Times,
      The Guardian, Associated Press, Reuters, BBC, People, Entertainment Tonight,
      USA Today, NBC News, CNN, CBS News, Boston Globe, TODAY, Empire, Total Film]
  2: [TV Insider, GQ, Esquire, IGN, Collider, Screen Rant, CBR, Polygon, Den of Geek,
      The AV Club, Slash Film, Bloody Disgusting, Dread Central, The Playlist,
      Discussing Film, Star Wars News Net, Redanian Intelligence, DisInsider,
      Heroic Hollywood, Screen Crush, Inverse, Bleeding Cool, Decider, Radio Times,
      JoBlo, ComicBook.com, ComingSoon, The Direct, Looper, Digital Spy, Consequence,
      The Film Stage, Gold Derby, CinemaBlend, The Cinema Spot, Gizmodo, io9,
      What's on Netflix, The Independent, Forbes, Mashable, GamesRadar, Kotaku,
      Game Rant, Us Weekly, E! News, Uproxx, TV Guide, Moviefone, GeekTyrant,
      Far Out, Just Jared, Flickering Myth]
  3: [IMDb, Yahoo, Yahoo Entertainment, MSN, AOL, TradingView, Newser, Flipboard,
      SmartNews, Inkl, Head Topics, Biz Pac Review]

# Same-parent outlets count 0.5 each towards independent breadth (one company
# publishing across its mastheads cannot manufacture a trend).
corporate_parents:
  PMC: [Deadline, Variety, Hollywood Reporter, Rolling Stone, IndieWire, TVLine,
        Gold Derby, Vibe, Billboard]
  Valnet: [Screen Rant, CBR, Collider, Game Rant, MovieWeb]
  Static Media: [Looper, SlashGear]
  Paramount: [ComicBook.com]

# Sister sites: "sister has it" signal for the MW coverage check. Never counted as
# MW's own coverage.
sister_sites: [Screen Rant, Collider, CBR]

# MW itself: never counted as a source; its articles feed the MW coverage check.
self_outlets: [MovieWeb]
